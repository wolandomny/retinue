version: 2

linters:
  # Restrict to exactly the linters we intend to enforce. Without `default: none`,
  # golangci-lint v2 also runs its default set (errcheck, staticcheck, unused), which
  # would surface a large backlog of findings out of scope for CI enforcement today.
  # A broader lint cleanup (and enabling more linters) is a separate effort.
  default: none
  enable:
    - govet
    - ineffassign

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
