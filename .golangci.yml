# golangci-lint v2 configuration.
# The version MUST be the string "2" (v2 schema requirement); a bare numeric
# `2` is rejected by `config verify`. CI runs the pinned v2 binary via
# golangci-lint-action@v8 (version v2.11.3), and `make lint` runs that same
# pinned version, so local and CI can never silently diverge.
version: "2"

linters:
  # Restrict to exactly the linters we intend to enforce. With `default: none`,
  # golangci-lint v2 does NOT run its default set (errcheck, staticcheck, unused),
  # which would surface a large backlog of findings out of scope for CI today.
  # A broader lint cleanup (and enabling more linters) is a separate effort.
  default: none
  enable:
    - govet
    - ineffassign
  # NOTE: The v1 `issues.exclude-use-default: false` is intentionally NOT
  # carried over as a key. In v1 that flag disabled the built-in default
  # exclusion presets; in v2 those presets are opt-in and are not applied
  # unless listed under `linters.exclusions`. Omitting any exclusions here
  # preserves the original behavior: report every finding from the enabled
  # linters with no built-in excludes.

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
